<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6eb">
  <meta name="description" content="Entre estar y PODER estar. Explora los sonidos de la alcaldía Cuauhtémoc y construye tu propio recorrido.">
  <title>Entre estar y PODER estar — Cuauhtémoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=cartography-2">
  <script src="script.js?v=cartography-2" defer></script>
</head>
<body>
  <svg class="territory" viewBox="0 0 940 1670" preserveAspectRatio="none" aria-hidden="true"><defs id="route-masks"></defs><g id="routes"></g></svg>
  <main>
    <header>
      <h1><span class="intro">Entre estar y</span><span class="power">PODER</span><span class="ending">estar</span></h1>
      <h2>Los sonidos de Cuauhtémoc</h2>
    </header>
    <section class="experience" aria-label="Escuchar el territorio">
      <p id="instructions" role="status" aria-live="polite" aria-atomic="true">Mantén presionado para escuchar un sonido de la alcaldía Cuauhtémoc.</p>
      <button class="sound-button" type="button" aria-label="Escuchar un sonido. Mantén presionado hasta que se complete el círculo para escuchar un fragmento de la ciudad." aria-describedby="instructions keyboard-help">
        <svg class="progress-ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="progress-guide" cx="60" cy="60" r="57"/><circle class="progress-trace" cx="60" cy="60" r="57" pathLength="100" transform="rotate(-90 60 60)"/></svg>
        <svg class="speaker" viewBox="0 0 96 96" fill="none" aria-hidden="true"><path d="M46 16 25 37H12v24h13l21 20V16Z"/><path d="M61 36c7 7 7 17 0 24M72 23c15 14 15 37 0 51"/></svg>
      </button>
      <p id="keyboard-help" class="sr-only">Con teclado, usa espacio o Enter. Mantén la tecla hasta que se cierre el círculo. Soltar antes cancela la escucha.</p>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
</body>
</html>
